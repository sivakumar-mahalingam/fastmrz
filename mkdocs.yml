site_name: FastMRZ Documentation
site_description: Documentation for FastMRZ - Extract Machine Readable Zone data from passport and document images
site_author: Sivakumar Mahalingam
site_url: https://sivakumar-mahalingam.github.io/fastmrz/

repo_name: sivakumar-mahalingam/fastmrz
repo_url: https://github.com/sivakumar-mahalingam/fastmrz
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/favicon.png

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            group_by_category: true
            heading_level: 2

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started.md
      - Supported Documents: supported-documents.md
      - Input Formats: input-formats.md
  - User Guide:
      - How It Works: how-it-works.md
      - Checksum Validation: checksum-validation.md
  - API Reference: api-reference.md
  - Limitations: limitations.md
  - Contributing: contributing.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sivakumar-mahalingam/fastmrz
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastmrz/
  version:
    provider: mike

copyright: Copyright &copy; 2024 Sivakumar Mahalingam
